version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: exhibitflow-rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - exhibitflow-network

networks:
  exhibitflow-network:
    driver: bridge

volumes:
  rabbitmq_data:
